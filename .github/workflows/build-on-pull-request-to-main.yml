name: Build PR branch

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:

  build-piano:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
   
    - name: Test Docker build
      id: build-image
      working-directory: ./piano-io
      run: |
        docker build .
