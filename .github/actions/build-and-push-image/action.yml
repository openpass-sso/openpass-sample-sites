name: Build and Push Image
description: Builds the image with an SBOM and provenance attestation, pushes it to ECR, and saves the SBOMs and scan config as an artifact

inputs:
  ecr-registry:
    description: ECR registry URL (from login-ecr output)
    required: true
  ecr-repository:
    description: ECR repository name
    required: true
  image-tag:
    description: Docker image tag
    required: true
  working-directory:
    description: Folder with the Dockerfile and package-lock.json
    required: false
    default: piano-io

runs:
  using: "composite"
  steps:
    - name: Create BuildKit builder
      shell: bash
      # The default docker driver cannot store attestations, so use a docker-container builder
      run: docker buildx create --name sbom-builder --driver docker-container --use

    - name: Build and push image with SBOM and provenance
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IMAGE: ${{ inputs.ecr-registry }}/${{ inputs.ecr-repository }}:${{ inputs.image-tag }}
        # Syft scanner image, pinned by digest
        SBOM_GENERATOR: docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
      run: |
        docker buildx build --push --sbom=generator="$SBOM_GENERATOR" --provenance=mode=max -t "$IMAGE" .
        echo "Pushed image to $IMAGE"

    - name: Prepare scan inputs
      id: scan-inputs
      uses: ./.github/actions/prepare-scan-inputs
      with:
        working-directory: ${{ inputs.working-directory }}
        # The image SBOM is scanned. The npm SBOM is kept in the artifact but not scanned, because the image
        # already contains those packages. Scan it too when the image no longer includes node_modules.
        npm-sbom-folder: archive

    - name: Collect image SBOM
      shell: bash
      env:
        IMAGE: ${{ inputs.ecr-registry }}/${{ inputs.ecr-repository }}:${{ inputs.image-tag }}
        SCAN_INPUTS_DIR: ${{ steps.scan-inputs.outputs.dir }}
      run: |
        # SBOM generated by BuildKit for the final image filesystem
        sbom="$SCAN_INPUTS_DIR/sbom/sbom-image.spdx.json"
        docker buildx imagetools inspect "$IMAGE" --format '{{ json .SBOM.SPDX }}' > "$sbom"
        if [ ! -s "$sbom" ] || [ "$(cat "$sbom")" = "null" ]; then
          echo "::error::No SBOM attestation found on $IMAGE"
          exit 1
        fi

    - name: Upload SBOMs and scan config
      uses: actions/upload-artifact@v7
      with:
        name: sbom-${{ inputs.image-tag }}
        path: ${{ steps.scan-inputs.outputs.dir }}/
        retention-days: 30
